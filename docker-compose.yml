services:
  oncall:
    build:
      # "." for a local clone; set BUILD_CONTEXT to the git URL when only the
      # compose file is deployed (e.g. Arcane GitOps):
      #   BUILD_CONTEXT=https://github.com/jbflowerday/yeastar-oncall.git#main
      context: ${BUILD_CONTEXT:-.}
      # Use the host's network/DNS for npm install during the build
      network: host
    image: yeastar-oncall:latest
    container_name: yeastar-oncall
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - oncall-data:/data

volumes:
  oncall-data:
